name: Build Linux Binary

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: x86_64-unknown-linux-musl

    - name: Install musl tools
      run: sudo apt-get update && sudo apt-get install -y musl-tools

    - name: Build static release binary
      run: cargo build --release --target x86_64-unknown-linux-musl

    - name: Prepare bundle directory
      run: |
        mkdir -p dist
        cp target/x86_64-unknown-linux-musl/release/antiscambot dist/
        cp scam_vectors.json dist/
        cp -r scam_templates dist/
        cd dist && tar -czvf ../antiscambot-linux-x86_64.tar.gz *

    - name: Upload Linux Binary Artifact
      uses: actions/upload-artifact@v4
      with:
        name: antiscambot-linux-x86_64
        path: dist/
