name: Build Anti-Scam Bot (Rust)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Compile static Linux binary
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain (stable + musl target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Install musl-tools (C linker for static binary)
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Cache Cargo registry & build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-musl-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-musl-

      - name: Build release binary (fully static, musl)
        run: cargo build --release --target x86_64-unknown-linux-musl

      - name: Show binary info
        run: |
          ls -lh target/x86_64-unknown-linux-musl/release/antiscambot
          file target/x86_64-unknown-linux-musl/release/antiscambot

      - name: Upload binary as artifact
        uses: actions/upload-artifact@v4
        with:
          name: antiscambot-linux
          path: target/x86_64-unknown-linux-musl/release/antiscambot
          retention-days: 90
